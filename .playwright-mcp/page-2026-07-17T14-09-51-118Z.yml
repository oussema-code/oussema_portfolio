  - generic [ref=e83]:
    - paragraph [ref=e88]: Atmosphère Lella Baya
    - generic [ref=e89]:
      - paragraph [ref=e90]: Notre Histoire
      - heading "Un Héritage Gastronomique" [level=2] [ref=e91]: Un HéritageGastronomique
      - generic [ref=e93]:
        - paragraph [ref=e94]: Né de la passion d'une famille tunisoise pour l'art de la table, Lella Baya rend hommage aux saveurs authentiques de la Tunisie, réinterprétées avec une élégance contemporaine.
        - paragraph [ref=e95]: Chaque plat raconte une histoire — celle des souks de Tunis, des oliveraies de Sfax, des pêcheries de Bizerte. Nos chefs puisent dans un savoir-faire transmis depuis quatre générations pour créer une expérience qui honore la terre et la mer de notre pays.
        - paragraph [ref=e96]: Dans un écrin sobre et lumineux, nous invitons nos convives à un voyage où la tradition rencontre la modernité, dans le plus grand respect des produits et des gestes d'antan.
      - link "Découvrir l'Expérience" [ref=e97] [cursor=pointer]:
        - /url: "#booking"
